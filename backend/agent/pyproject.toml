[project]
name = "smart-meeting-agent"
version = "0.1.0"
description = "Meeting agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.1",
    "vision-agents[gemini,getstream]>=0.3.1",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "redis>=5.0.0",
]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "vision_agents.*"
]
ignore_missing_imports = true
