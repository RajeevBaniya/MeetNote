[project]
name = "smart-meeting-api"
version = "0.1.0"
description = "FastAPI service for Smart Meeting"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "email-validator>=2.0.0",
    "redis>=5.0.0",
    "websockets>=14.0",
    "getstream>=2.7.1",
    "httpx>=0.27.0",
    "sentry-sdk[fastapi]>=2.19.2",
    "pgvector>=0.2.0",
    "pypdf>=5.0.0",
]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "jose.*",
    "getstream.*",
    "pgvector.*"
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


