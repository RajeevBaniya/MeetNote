[project]
name = "smart-meeting-summarize"
version = "0.1.0"
description = "FastAPI service for Summerease meeting summarization"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.27.0",
    "sentry-sdk[fastapi]>=2.19.2",
    "reportlab>=4.2.0",
    "python-docx>=1.1.2",
    "pypdf>=5.0.0",
    "mammoth>=1.8.0",
    "google-api-python-client>=2.128.0",
    "google-auth>=2.29.0",
    "google-auth-oauthlib>=1.2.0",
    "python-multipart>=0.0.9",
    "aioboto3>=15.5.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true
